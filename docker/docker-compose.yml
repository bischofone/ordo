# Eigener Server für Ordo: Radicale (CalDAV) + Caddy (HTTPS, App, Weiterleitung).
# App und CalDAV laufen unter DERSELBEN Adresse (https://DOMAIN/ und https://DOMAIN/dav/),
# deshalb braucht der Browser keine CORS-Freigaben.
#
#   1. cp .env.example .env   und DOMAIN eintragen
#   2. Benutzer anlegen (siehe README.md in diesem Ordner)
#   3. docker compose up -d
#
# Aktualisieren:  ./update.sh   (holt das neueste Image und startet neu; Daten bleiben)
# Das Image ghcr.io/bischofone/ordo baut GitHub nach jedem geprüften Stand. Ist es nicht
# erreichbar, baut Docker es aus diesem Ordner selbst (docker compose build).
services:
  radicale:
    image: tomsquest/docker-radicale:3.9.1.1
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    volumes:
      - radicale-data:/data
      - ./radicale/config:/config/config:ro
      - ./radicale/users:/config/users:ro
    healthcheck:
      test: curl -f http://127.0.0.1:5232 || exit 1
      interval: 30s
      retries: 3

  caddy:
    # Caddy mit der fertigen App und dem Caddyfile aus diesem Ordner
    image: ${ORDO_IMAGE:-ghcr.io/bischofone/ordo:latest}
    build:
      context: ..
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
      ORDO_PROXY_HOSTS: ${ORDO_PROXY_HOSTS:-keiner.invalid}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - radicale

volumes:
  radicale-data:
  caddy-data:
  caddy-config:
