# Prüft bei jedem Push und Pull Request: Typen, Formatierung, Lint, Unit- und Browser-Tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      - name: Typen prüfen
        run: pnpm check

      - name: Formatierung und Lint
        run: pnpm lint

      - name: Unit-Tests
        run: pnpm test:unit --run

      - name: Browser installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-Tests
        run: pnpm test:e2e

      - name: Testberichte bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ergebnisse
          path: test-results/
          retention-days: 7

  # Nur wenn alle Tests auf main grün sind: fertige Pakete für „update“ veröffentlichen.
  # - Release „main-build“: ordo-app.tar.gz, ordo-lxc.sh, version.txt (für den Proxmox-LXC)
  # - Docker-Image ghcr.io/<besitzer>/ordo:latest (für docker compose)
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: App bauen
        run: pnpm build
        env:
          ORDO_COMMIT: ${{ github.sha }}

      - name: Update-Paket schnüren
        run: scripts/release-pack.sh release
        env:
          ORDO_COMMIT: ${{ github.sha }}

      - name: Release „main-build“ erneuern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f main-build "$GITHUB_SHA"
          git push -f origin refs/tags/main-build
          notes="Immer der neueste geprüfte Stand von main ($(git log -1 --format='%h – %s')). Wird von „update“ im Ordo-LXC geladen."
          if gh release view main-build >/dev/null 2>&1; then
            gh release edit main-build --prerelease --title "Ordo (neuester Stand)" --notes "$notes"
          else
            gh release create main-build --prerelease --title "Ordo (neuester Stand)" --notes "$notes"
          fi
          # Steckbrief zuletzt: erst wenn er neu ist, sieht „update“ die neue Version
          gh release upload main-build release/ordo-app.tar.gz release/ordo-lxc.sh --clobber
          gh release upload main-build release/version.txt --clobber

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker-Image veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ORDO_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ordo:latest
            ghcr.io/${{ github.repository_owner }}/ordo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
